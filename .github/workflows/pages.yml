name: Deploy Stakeholder Charts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'customers/**/index.md'
      - 'scripts/generate_stakeholder_charts.py'
      - 'stakeholder maps/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate charts
        run: python3 scripts/generate_stakeholder_charts.py

      - name: Copy to docs folder for Pages
        run: |
          rm -rf docs
          cp -r "stakeholder maps" docs

      - name: Verify output
        run: |
          echo "Generated charts in docs/:"
          ls -la docs/*.html | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4