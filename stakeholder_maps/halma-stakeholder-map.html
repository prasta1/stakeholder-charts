<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Halma Stakeholder Map</title>
<style>
  :root {
    --bg: #050b14;
    --card: rgba(15,23,42,0.6);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #1f2937;
    --high: #f59e0b;
    --medium: #34d399;
    --low: #60a5fa;
    --group-fill: rgba(30,41,59,0.5);
  }
  * { box-sizing: border-box; }
  html,body {
    margin:0; padding:0;
    background: radial-gradient(1200px 800px at 10% -10%, #0b1d33 0%, transparent 60%),
                radial-gradient(900px 600px at 110% 10%, #0d1f2d 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  header .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 12px #22d3aa;
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .75; transform: scale(1.15); }
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .legend {
    display: flex;
    gap: 14px;
    margin: 10px 0 18px;
    font-size: 12px;
  }
  .legend .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .legend .swatch {
    width: 10px; height: 10px;
    border-radius: 2px;
  }
  .stage {
    background: linear-gradient(180deg, rgba(15,23,42,0.4) 0%, rgba(15,23,42,0.2) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    backdrop-filter: blur(4px);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .row + .row {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .row .label {
    width: 100%;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .node {
    flex: 1 1 180px;
    max-width: 260px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    position: relative;
    overflow: hidden;
  }
  .node::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .node.high::before { background: var(--high); }
  .node.medium::before { background: var(--medium); }
  .node.low::before { background: var(--low); }
  .node .name {
    font-size: 14px;
    font-weight: 600;
    color: #f8fafc;
  }
  .node .role {
    margin-top: 2px;
    font-size: 12px;
    color: #cbd5e1;
  }
  .node .meta {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .node .badge {
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
  }
  .group {
    flex: 1 1 220px;
    background: var(--group-fill);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .group h4 {
    margin: 0 0 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    color: #cbd5e1;
  }
  .group .row { margin-top: 8px; }
  footer {
    margin-top: 18px;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="dot" aria-hidden="true"></div>
      <div>
        <h1>Halma Stakeholder Map</h1>
        <p>Customer contacts edited over time. Add new contacts in the customer file.</p>
      </div>
    </header>

    <div class="legend">
      <div class="pill"><span class="swatch" style="background:var(--high)"></span>High influence</div>
      <div class="pill"><span class="swatch" style="background:var(--medium)"></span>Medium influence</div>
      <div class="pill"><span class="swatch" style="background:var(--low)"></span>Low influence</div>
    </div>

    <div class="stage">

    </div>

    <footer>
      <span>Halma</span>
      <span>27 active contacts</span>
    </footer>
  </div>
</body>
</html>
